# Simulator overrides for Kor Bekçi (values measured from the four recordings).
# Load with: python -m bossai.training.train --sim-config configs/kor_bekci_sim.yaml
level: 0               # curriculum start; the trainer raises it automatically
dash_charges: 3        # 3 charges, "0,x" short lock between dashes
dash_gap: [0.9, 1.05]       # "1,0" countdown
dash_charge_regen: [3.0, 3.8]   # one charge back every ~3.3 s
dash_empty_lockout: [7.5, 8.5]  # ~8 s after the third dash
melee_range: [2.0, 3.0]         # boss bar shows "2 m" while fighting
skill_interval: [5.0, 8.0]      # ~7 s between attacks in the recordings
kill_time: [70, 110]            # whole fight ~130 s with dodging
# Not measured yet (need a calibration clip): walk_speed, dash_distance, dash_iframes
